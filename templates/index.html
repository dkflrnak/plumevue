<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<!-- 모바일 반응형 핵심 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PLUME VUE CARD NEWS</title>

<style>

/* =========================
   BASE RESET
========================= */
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:sans-serif;
    background:#f5ece1;

    /* 모바일 여백 */
    padding:20px;
}

/* =========================
   LAYOUT
========================= */
.container{

    /* 기존 720px 유지 + 모바일 대응 */
    width:100%;
    max-width:720px;

    margin:40px auto;
}

/* =========================
   CARD WRAPPER
========================= */
.card{
    background:white;
    padding:35px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
    overflow:hidden;
}

/* =========================
   TITLE
========================= */
h1{
    text-align:center;
    margin-bottom:30px;
    font-size:24px;

    /* 모바일 줄바꿈 대응 */
    line-height:1.3;
}

/* =========================
   INPUTS
========================= */

/* 일반 input */
input[type="text"]{
    width:100%;
    padding:15px;
    margin-bottom:18px;
    border:none;
    border-radius:14px;
    background:#f3f3f3;

    /* 모바일 확대 방지 */
    font-size:16px;
}

/* select */
select{
    width:100%;
    padding:15px;
    margin-bottom:18px;
    border:none;
    border-radius:14px;
    background:#f3f3f3;

    font-size:16px;
}

/* =========================
   FILE UPLOAD
========================= */
input[type="file"]{
    width:100%;
    padding:18px;
    margin-bottom:18px;
    border:2px dashed #d0d0d0;
    border-radius:14px;
    background:#fff;

    font-size:15px;
}

/* file 버튼 스타일 */
input[type="file"]::file-selector-button{
    background:#d9b99b;
    border:none;
    padding:10px 14px;
    border-radius:10px;
    color:white;
    cursor:pointer;

    margin-right:10px;
}

/* =========================
   BUTTON
========================= */
button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    background:#111;
    color:white;
    font-size:16px;
    cursor:pointer;

    transition:0.2s;
}

/* hover */
button:hover{
    opacity:0.9;
}

/* =========================
   RESULT AREA
========================= */
.preview{
    margin-top:25px;
    padding:15px;
    background:#fafafa;
    border-radius:15px;
    font-size:14px;
}

/* 이미지 */
.preview img{
    width:100%;
    border-radius:12px;
    display:block;
}

/* =========================
   MOBILE
========================= */
@media (max-width:768px){

    body{
        padding:14px;
    }

    .container{
        width:100%;
        margin:20px auto;
    }

    .card{

        /* 모바일 패딩 축소 */
        padding:22px;

        border-radius:20px;
    }

    h1{
        font-size:20px;
        margin-bottom:24px;
    }

    input[type="text"],
    select,
    button{
        padding:14px;
        border-radius:12px;
    }

    input[type="file"]{
        padding:14px;
    }

    .preview{
        padding:12px;
    }
}

/* =========================
   SMALL MOBILE
========================= */
@media (max-width:480px){

    h1{
        font-size:18px;
    }

    .card{
        padding:18px;
    }

    input[type="text"],
    select,
    button{
        font-size:15px;
    }
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>PLUME VUE CARD NEWS</h1>

<form method="POST" enctype="multipart/form-data">

<!-- 주제 -->
<input type="text" name="topic" placeholder="주제를 입력하세요">

<!-- 템플릿 -->
<select name="template">
    <option value="dark">Dark Luxury</option>
    <option value="light">Light Minimal</option>
</select>

<!-- 이미지 업로드 -->
<input type="file" name="images" multiple>

<!-- 버튼 -->
<button type="submit">카드뉴스 생성</button>

</form>

<!-- 결과 -->
<div class="preview">

    {% if generated_images %}

        {% for img in generated_images %}
            <div style="margin-bottom:15px;">
                <img src="{{ url_for('static', filename=img) }}">
            </div>
        {% endfor %}

    {% else %}
        여기에 결과가 표시됩니다
    {% endif %}

</div>

</div>

</div>

</body>
</html>
